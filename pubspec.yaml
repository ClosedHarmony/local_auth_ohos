name: local_auth_ohos
description: >-
  HarmonyOS local authentication (fingerprint / face / device PIN)
  implementation for local_auth, backed by the UserIAM userAuth kit
  (@ohos.userIAM.userAuth).
version: 1.0.0
homepage: https://github.com/TsinbeiLabs/local_auth_ohos
repository: https://github.com/TsinbeiLabs/local_auth_ohos
issue_tracker: https://github.com/TsinbeiLabs/local_auth_ohos/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  local_auth_platform_interface: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: local_auth
    platforms:
      ohos:
        package: org.tsinbeilabs.local_auth_ohos
        pluginClass: LocalAuthOhosPlugin
        dartPluginClass: LocalAuthOhos

topics:
  - authentication
  - biometrics
  - harmonyos
  - ohos
